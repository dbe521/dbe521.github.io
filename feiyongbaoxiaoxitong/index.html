<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>费用报销系统 · 演示版</title>
<style>
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --surface-2:#F5F0EA; --surface-3:#FBF9F6;
  --line:#E9E2D9; --line-strong:#DAD0C3;
  --ink:#221F1B; --ink-2:#565048; --ink-3:#857D72;
  --brand:#3A4E7A; --brand-soft:#DFE6F4;
  --c-purchase:#E6DEFB; --c-purchase-ink:#4B3F86;
  --c-expense:#CFEFE2;  --c-expense-ink:#14604A;
  --c-amount:#FFE7BE;   --c-amount-ink:#8A5610;
  --c-wait:#FFF1C9;     --c-wait-ink:#8A6410;
  --c-info:#D9E7FF;     --c-info-ink:#274A8C;
  --c-danger:#F7DCD5;   --c-danger-ink:#A2452F;
  --c-ok:#D5F0DC;       --c-ok-ink:#1D6040;
  --c-neutral:#EDE7DE;  --c-neutral-ink:#6A6257;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --shadow-1:0 1px 2px rgba(43,38,32,.05);
  --shadow-2:0 8px 24px -10px rgba(43,38,32,.16);
  --shadow-3:0 26px 60px -24px rgba(43,38,32,.28);
  --ease:cubic-bezier(0.16,1,0.3,1); --dur:240ms;
  --font:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-num:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.7;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.atmos{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 47px,rgba(43,38,32,.02) 47px,rgba(43,38,32,.02) 48px),
                   repeating-linear-gradient(90deg,transparent,transparent 47px,rgba(43,38,32,.02) 47px,rgba(43,38,32,.02) 48px)}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.02em}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* 侧栏 */
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;font-family:var(--font-num)}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.04em}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.18em}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);color:var(--ink-2);font-size:14px;min-height:42px;border-left:3px solid transparent;cursor:pointer;transition:all var(--dur) var(--ease);border-top:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;font-family:var(--font)}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--brand-soft);color:var(--ink);font-weight:600;border-left-color:var(--brand)}
.nav .dot{width:8px;height:8px;border-radius:3px;flex:none}
.nav .badge{margin-left:auto;font-family:var(--font-num);font-size:12px;padding:1px 7px;border-radius:999px;background:var(--c-purchase);color:var(--c-purchase-ink)}
.side-foot{margin-top:auto;padding:12px;border-radius:var(--r-md);background:var(--surface-2);font-size:12.5px;color:var(--ink-3)}






/* 主区 */
.main{padding:26px 30px 60px;min-width:0}
.topbar{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
.topbar h1{font-size:25px}
.topbar .sub{color:var(--ink-3);font-size:13.5px}
.spacer{margin-left:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden;margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15.5px}
.panel-head .meta{font-size:13px;color:var(--ink-3)}
.panel-body{padding:18px 20px}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;border-top:3px solid var(--accent,var(--brand));box-shadow:var(--shadow-1)}
.stat .k{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.stat .v{font-family:var(--font-num);font-size:27px;font-weight:600;line-height:1.25;margin-top:2px}
.stat .hint{font-size:12px;color:var(--ink-3)}
.stat.purchase{--accent:var(--c-purchase)} .stat.purchase .v{color:var(--c-purchase-ink)}
.stat.expense{--accent:var(--c-expense)}  .stat.expense .v{color:var(--c-expense-ink)}
.stat.amount{--accent:var(--c-amount)}    .stat.amount .v{color:var(--c-amount-ink)}
.stat.wait{--accent:var(--c-info)}        .stat.wait .v{color:var(--c-info-ink)}

/* 表格 */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:12.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);padding:11px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
tbody td{padding:13px 20px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--dur) var(--ease)}
tbody tr.click:hover{background:var(--surface-2);cursor:pointer}
.td-right{text-align:right}
.no{font-family:var(--font-num);font-size:13px;color:var(--ink-2)}
.strong{font-weight:600}
.bar{display:inline-block;width:3px;height:18px;border-radius:2px;margin-right:10px;vertical-align:-4px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:6px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.tag.purchase{background:var(--c-purchase);color:var(--c-purchase-ink)}
.tag.expense{background:var(--c-expense);color:var(--c-expense-ink)}
.tag.wait{background:var(--c-wait);color:var(--c-wait-ink)}
.tag.info{background:var(--c-info);color:var(--c-info-ink)}
.tag.ok{background:var(--c-ok);color:var(--c-ok-ink)}
.tag.danger{background:var(--c-danger);color:var(--c-danger-ink)}
.tag.mute{background:var(--c-neutral);color:var(--c-neutral-ink)}
.amt{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums}
.amt.lead{background:var(--c-amount);color:var(--c-amount-ink);padding:3px 9px;border-radius:6px;font-size:15px}

/* 按钮与表单 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:var(--r-md);border:1px solid transparent;padding:9px 18px;min-height:42px;transition:all var(--dur) var(--ease)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{box-shadow:var(--shadow-2)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--c-danger);color:var(--c-danger-ink)}
.btn-gold{background:var(--c-amount-ink);color:#fff}
.btn-sm{padding:6px 13px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.04em}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:9px 12px;width:100%;min-height:42px}
textarea{min-height:92px;resize:vertical}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.blocks{display:flex;gap:10px;flex-wrap:wrap}
.block{flex:1 1 130px;min-height:64px;border-radius:var(--r-md);cursor:pointer;border:1px solid var(--line-strong);background:var(--surface-3);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 14px;transition:all var(--dur) var(--ease)}
.block .t{font-size:14.5px;font-weight:600}
.block .s{font-size:12px;color:var(--ink-3)}
.block.on{background:var(--c-info);border-color:var(--brand);color:var(--c-info-ink)}
.block.on .s{color:inherit;opacity:.75}
.item-row{display:grid;grid-template-columns:minmax(0,1.3fr) 170px minmax(0,1fr) 40px;gap:10px;margin-bottom:10px;align-items:center}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* 详情整页 */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.44);backdrop-filter:blur(2px);z-index:50;display:flex;animation:fade .2s var(--ease) both}
.overlay.full{padding:0;align-items:flex-start;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.fullsheet{background:var(--bg);width:100%;min-height:100vh;display:flex;flex-direction:column;animation:pop .22s var(--ease) both}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.sheet-head h3{font-size:15.5px}
.sheet-body{flex:0 0 auto;min-height:calc(100vh - 62px);overflow:visible;padding:20px 22px 48px}
.sheet-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.sheet-main{min-width:0}
.sheet-side{position:sticky;top:78px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-2)}
.side-card h3{font-size:14px;margin:0 0:14px;letter-spacing:.06em}
.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.meta-grid .k{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:1px}
.meta-grid .v{font-size:14.5px}
.flow{display:flex;align-items:center;gap:8px;padding:16px 20px;flex-wrap:wrap}
.flow-step{display:flex;align-items:center;gap:8px;font-size:13.5px}
.flow-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-family:var(--font-num);font-weight:600;background:var(--c-ok);color:var(--c-ok-ink)}
.flow-dot.now{background:var(--c-wait);color:var(--c-wait-ink)}
.flow-dot.todo{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-strong)}
.flow-line{width:34px;height:1px;background:var(--line-strong)}
.file-list{display:grid;gap:8px;margin-top:10px}
.file-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-3);font-size:13.5px}
.file-ico{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.note{border-left:3px solid var(--c-info);background:var(--surface-2);padding:12px 16px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:13.5px;color:var(--ink-2)}
.empty{padding:46px 20px;text-align:center;color:var(--ink-3)}

/* 图表条 */
.chart-row{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:12px;align-items:center;margin-bottom:10px;font-size:13.5px}
.chart-track{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.chart-fill{height:100%;border-radius:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Toast */
.toast-wrap{position:fixed;right:22px;bottom:22px;z-index:99;display:grid;gap:10px}
.toast{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-md);padding:11px 16px;box-shadow:var(--shadow-2);font-size:14px;animation:pop .2s var(--ease) both}
.toast.ok{border-left-color:var(--c-ok-ink)}
.toast.err{border-left-color:var(--c-danger-ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 二级菜单缩进 */
.nav.sub{padding-left:34px;font-size:13.5px;min-height:38px}
.nav.sub .dot{width:6px;height:6px}
/* 顶栏当前用户标签 */
.who{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
.who b{font-weight:650;color:var(--ink)}

/* 审批流配置：列宽固定，下拉完整显示、金额框收窄 */
.flow-grid th:nth-child(1){width:118px}
.flow-grid th:nth-child(2){width:118px}
.flow-grid th:nth-child(3){width:110px}
.flow-grid th:nth-child(4){width:110px}
.flow-grid th:nth-child(7){width:78px}
.flow-grid td select{width:100%;min-width:112px;padding:7px 10px;min-height:38px;font-size:13.5px}
.flow-grid td input[type=number]{width:92px;text-align:right;padding:7px 10px;min-height:38px;font-size:13.5px}

/* ============================================================
   登录页：深墨蓝品牌面板（左） + 浅色表单区（右）强对比
   ============================================================ */
.login-wrap{position:fixed;inset:0;z-index:200;display:grid;grid-template-columns:1.02fr 1fr;background:var(--bg);animation:fade .3s var(--ease) both}
.login-brand{position:relative;background:#15253F;color:#fff;padding:54px 58px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.login-brand::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.055) 39px,rgba(255,255,255,.055) 40px),
             repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.055) 39px,rgba(255,255,255,.055) 40px)}
.login-brand::after{content:"";position:absolute;right:-90px;bottom:-90px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle at 32% 32%,rgba(216,166,87,.24),transparent 66%)}
.login-brand>*{position:relative}
.login-logo{display:flex;align-items:center;gap:12px}
.login-mark{width:38px;height:38px;border-radius:11px;background:#D8A657;color:#15253F;display:grid;place-items:center;font-size:19px;font-weight:700;font-family:var(--font-num)}
.login-logo .n{font-size:16px;font-weight:650;letter-spacing:.06em}
.login-logo .s{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.22em}
.login-title{font-size:40px;line-height:1.16;letter-spacing:-.02em;font-weight:650;margin-top:auto}
.login-gold{width:54px;height:3px;background:#D8A657;margin:18px 0 22px}
.login-desc{font-size:14.5px;color:rgba(255,255,255,.78);line-height:1.75;max-width:420px}
.login-points{display:grid;gap:12px;margin:26px 0 0;font-size:14px;color:rgba(255,255,255,.8);line-height:1.6}
.login-points div{display:flex;gap:10px;align-items:flex-start}
.login-points i{width:6px;height:6px;border-radius:2px;background:#D8A657;margin-top:9px;flex:none}
.login-points b{color:#fff;font-weight:600}
.login-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid rgba(255,255,255,.16);padding-top:20px;margin-top:auto}
.login-stats .v{font-family:var(--font-num);font-size:21px;font-weight:600}
.login-stats .k{font-size:12px;color:rgba(255,255,255,.58);letter-spacing:.04em}
.login-form{display:flex;align-items:center;justify-content:center;padding:48px 56px;background:var(--bg)}
.login-box{width:100%;max-width:404px}
.login-box h2{font-size:25px;letter-spacing:.01em}
.login-box .sub{color:var(--ink-3);font-size:13.5px;margin-top:6px}
.role-cards{display:grid;gap:12px;margin:24px 0 20px}
.role-card{border:1.5px solid var(--line-strong);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;display:flex;gap:13px;align-items:center;background:var(--surface);transition:all var(--dur) var(--ease);min-height:78px}
.role-card:hover{border-color:var(--brand)}
.role-card.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:var(--shadow-1)}
.role-avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.role-card .n{font-size:15px;font-weight:650}
.role-card .d{font-size:12.5px;color:var(--ink-3)}
.login-tip{font-size:12.5px;color:var(--ink-3);margin-top:14px;line-height:1.65}
@media (max-width:900px){
  .login-wrap{grid-template-columns:1fr}
  .login-brand{display:none}
  .login-form{padding:36px 24px}
}
@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-grid{grid-template-columns:minmax(0,1fr)}
  .sheet-side{position:static}
  .meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item-row{grid-template-columns:minmax(0,1fr) 140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="atmos"></div>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">¥</span>
      <div><div class="brand-name">费用报销系统</div><div class="brand-sub">DEMO</div></div>
    </div>
    <div id="nav"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="page-title">工作台</h1><div class="sub" id="page-sub"></div></div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">退出登录</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="overlay-root"></div>
<div id="login-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
/* ============================================================

    { name: '陈静',   account: '6217 0033 2211 0099', bank: '中国银行' },
    { name: '李娜',   account: '6228 4810 2299 3311', bank: '农业银行' },
    { name: '张伟',   account: '6212 2602 0011 4455', bank: '工商银行' },

  ],

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function pagesForRole() {
  return PAGES
    .filter((p) => !p.only || p.only.includes(S.role))
    .map((p) => (p.k === 'home' ? { ...p, label: isBoss() ? '经营驾驶舱' : '财务工作台' } : p));
}

function renderNav() {
  const pend = pendingFor().length;
  let html = '';
  pagesForRole().forEach((p) => {
    const badge = p.k === 'todo' && pend ? `<span class="badge">${pend}</span>` : '';
    html += `<button class="nav${S.page === p.k ? ' on' : ''}" onclick="go('${p.k}')"><span class="dot" style="background:${p.dot}"></span>${p.label}${badge}</button>`;
    (p.children || []).forEach((c) => {
      const on = S.page === c.k || (S.page === p.k && S.filter === c.k);
      html += `<button class="nav sub${on ? ' on' : ''}" onclick="go('${c.k}')"><span class="dot" style="background:${c.dot}"></span>${c.label}</button>`;
    });
  });
  document.getElementById('nav').innerHTML = html;
  const u = me();
  document.getElementById('side-foot').textContent = `${u.name}（${u.title}）· ${u.dept}`;
  const w = document.getElementById('who');
  if (w) w.innerHTML = `<b>${u.name}</b> · ${isBoss() ? '老板' : '财务'}`;
}

   交互
   ============================================================ */
let payState = { settlement: null, receipt: null };

function setPaySettle(v) {
  payState.settlement = v;
  ['monthly', 'cash', 'weekly'].forEach((k) => {
    const el = document.getElementById('ps-' + k);
    if (el) el.classList.toggle('on', k === v);
  });
}
function fakeReceipt() {
  payState.receipt = '回单-' + Date.now().toString().slice(-6) + '.pdf';
  document.getElementById('receipt-tip').textContent = '已上传：' + payState.receipt;
  toast('回单已上传', 'ok');
}
function doPay(id) {
  const r = S.reports.find((x) => x.id === id);
  const acc = document.getElementById('pay-acc').value;
  const note = document.getElementById('pay-note').value;
  const st = payState.settlement || r.settlement || 'monthly';
  r.status = 'paid';
  r.flow = r.flow.map((f) => (f.n === 'cashier' ? { n: 'cashier', s: 'done', by: '刘敏', at: nowStr() } : f));
  if (!r.flow.some((f) => f.n === 'cashier')) r.flow.push({ n: 'cashier', s: 'done', by: '刘敏', at: nowStr() });
  r.cashier = { account: acc, settlement: st, at: nowStr(), note, receipt: payState.receipt };
  pushLog(me().name, '登记付款', `${r.no} ${acc}${st ? '（' + SETTLEMENT_LABEL[st] + '）' : ''} ¥${money(total(r))}`);
  S.notifications.unshift({ t: nowStr(), title: r.no + ' 已付款', body: `付款账户：${acc}`, read: false, to: 'boss' });
  payState = { settlement: null, receipt: null };
  closeAll();
  toast(`付款已登记：${r.no}`, 'ok');
  render();
}

function act(kind, id) {
  const r = S.reports.find((x) => x.id === id);
  const cmt = (document.getElementById('cmt') || {}).value || '';
  if (kind === 'reject') {
    const reason = cmt.trim() || window.prompt('请填写驳回原因', '请补充凭证后重新提交');
    if (!reason) return;
    r.status = 'rejected';
    r.rejectReason = reason;
    r.flow = r.flow.map((f) => (f.s === 'now' ? { ...f, s: 'done', by: me().name, at: nowStr(), comment: reason } : f));
    pushLog(me().name, '驳回', `${r.no} ${reason}`);
    toast(`已驳回：${r.no}`, 'err');
  } else {
    const node = myNode();
    r.flow = r.flow.map((f) => (f.s === 'now' ? { ...f, s: 'done', by: me().name, at: nowStr(), comment: cmt } : f));
    const nextNode = node === 'boss' ? 'finance' : 'cashier';
    const hasNext = r.flow.some((f) => f.n === nextNode && f.s === 'todo');
    if (hasNext) {
      r.flow = r.flow.map((f) => (f.n === nextNode ? { ...f, s: 'now' } : f));
      r.status = nextNode === 'finance' ? 'pending_finance' : 'approved';
    } else {
      r.status = 'approved';
    }
    pushLog(me().name, '审批通过', `${r.no} ${NODE_LABEL[node]}节点`);
    S.notifications.unshift({ t: nowStr(), title: r.no + ' 已通过', body: `${me().name} 通过 ${NODE_LABEL[node]}`, read: false, to: node === 'boss' ? 'cw' : 'boss' });
    toast(`已通过：${r.no}`, 'ok');
  }
  closeAll();
  render();
}

function setForm(k, v) { form[k] = v; render(); }
function setItem(i, k, v) { form.items[i][k] = v; render(); }
function addItem() { form.items.push({ p: form.type === 'purchase' ? '物流运费' : '办公用品', a: '', r: '' }); render(); }
function delItem(i) { form.items.splice(i, 1); render(); }
function fakeUpload() { form.atts.push({ n: '发票-' + (form.atts.length + 1) + '.pdf', s: '320 KB', t: 'PDF' }); toast('附件已上传', 'ok'); render(); }
function delAtt(i) { form.atts.splice(i, 1); render(); }

function submitForm() {
  const valid = form.items.filter((i) => Number(i.a) > 0);
  if (!valid.length) { toast('请至少填写一条有效金额明细', 'err'); return; }
  const t = valid.reduce((s, i) => s + Number(i.a), 0);
  const isP = form.type === 'purchase';
  const rule = matchRule(form.type, isP ? form.settlement : '', t);
  const nodes = rule ? rule.nodes : ['finance', 'cashier'];
  const first = nodes[0];
  const id = Math.max(...S.reports.map((r) => r.id)) + 1;
  const no = (isP ? 'QK' : 'BX') + '-20261022-00' + String(id).padStart(2, '0');
  S.reports.unshift({
    id, no, type: form.type, biz: form.biz, applicant: me().name, dept: form.biz === 'ecommerce' ? '电商' : '渠道',
    supplier: isP ? form.supplier : undefined, payee: isP ? undefined : form.payee,
    settlement: isP ? form.settlement : undefined, date: form.date,
    items: valid.map((i) => ({ p: i.p, a: Number(i.a), r: i.r })),
    status: first === 'boss' ? 'pending_boss' : 'pending_finance',
    flow: nodes.map((n, i) => ({ n, s: i === 0 ? 'now' : 'todo' })),
    atts: form.atts.slice()
  });
  pushLog(me().name, '提交单据', `${no} ¥${money(t)}`);
  S.notifications.unshift({ t: nowStr(), title: no + ' 待你审批', body: `${me().name} 提交 ${isP ? '采购请款' : '费用报销'} ¥${money(t)}`, read: false, to: first === 'boss' ? 'boss' : 'cw' });
  form = null;
  toast(`已提交：${no}（${nodes.map((n) => NODE_LABEL[n]).join(' → ')}）`, 'ok');
  go('todo');
}

function matchRule(type, settlement, amount) {
  const rs = S.flow.filter((r) => r.type === type)
    .filter((r) => !r.settlement || r.settlement === settlement)
    .filter((r) => amount >= r.min && (r.max === null || amount < r.max))
    .sort((a, b) => (a.settlement ? 1 : 0) - (b.settlement ? 1 : 0) || b.min - a.min);
  return rs[0] || null;
}

function updRule(id, k, v) {
  const r = S.flow.find((x) => x.id === id);
  if (k === 'min' || k === 'max') r[k] = v === '' ? null : Number(v);
  else r[k] = v;
}
function delRule(id) { S.flow = S.flow.filter((r) => r.id !== id); render(); }
function addRule() {
  S.flow.push({ id: Date.now(), type: 'purchase', settlement: 'monthly', min: 0, max: null, nodes: ['finance', 'cashier'], desc: '新增规则' });
  render();
}
function saveFlow() { toast('审批流配置已保存（演示环境仅保存在当前页面）', 'ok'); }

function exportCsv() {
  const rows = [['单号', '类型', '申请人', '部门', '日期', '结算方式', '状态', '金额']];
  S.reports.forEach((r) => rows.push([r.no, r.type === 'purchase' ? '采购请款' : '费用报销', r.applicant, r.dept, r.date, r.settlement ? SETTLEMENT_LABEL[r.settlement] : '', STATUS_META[r.status].label, total(r).toFixed(2)]));
  const csv = '\uFEFF' + rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = '费用报销统计.csv';
  a.click();
  toast('已导出 CSV', 'ok');
}

function nowStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function pushLog(u, a, d) { S.logs.unshift({ t: nowStr(), u, a, d }); }
function readAll() { S.notifications.forEach((n) => { if (n.to === S.role) n.read = true; }); render(); }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

      </div>
      <div class="login-stats">
        <div><div class="v">19</div><div class="k">演示单据</div></div>
        <div><div class="v">2</div><div class="k">业务部门</div></div>
        <div><div class="v">3</div><div class="k">结算方式</div></div>
      </div>
    </div>
    <div class="login-form">
      <div class="login-box">
        <h2>演示登录</h2>
        <div class="sub">选择一个角色，密码已自动填好，直接点「进入系统」即可</div>
        <div class="role-cards">
          ${cards.map((c) => `
            <div class="role-card${S.loginRole === c.k ? ' on' : ''}" onclick="pickRole('${c.k}')">
              <span class="role-avatar" style="background:${c.color}">${c.mark}</span>
              <div><div class="n">${c.name} · ${c.title}</div><div class="d">${c.desc}</div></div>
            </div>`).join('')}
        </div>
        <div class="field"><label>账号</label><input id="lg-user" value="${S.loginRole}" readonly /></div>
        <div class="field"><label>密码</label><input id="lg-pass" type="text" value="123" /></div>
        <button class="btn btn-primary" style="width:100%" onclick="doLogin()">进入系统</button>
        <div class="login-tip">演示账号：<b>boss</b>（老板）/ <b>cw</b>（财务），统一密码 <b>123</b>。点上方角色卡可快速切换。</div>
      </div>
    </div>
  </div>`;
}
function pickRole(k) { S.loginRole = k; render(); }
function doLogin() {
  S.role = S.loginRole;
  S.stage = 'app';
  S.page = 'home';
  form = null;
  render();
  toast(`欢迎，${me().name}（${me().title}）`, 'ok');
}
function logout() { S.stage = 'login'; S.detailId = null; S.payId = null; render(); }

function render() {
  const shell = document.querySelector('.shell');
  const loginRoot = document.getElementById('login-root');
  if (S.stage === 'login') {
    shell.style.display = 'none';
    document.getElementById('overlay-root').innerHTML = '';
    loginRoot.innerHTML = loginHtml();
    return;
  }
  shell.style.display = '';
  loginRoot.innerHTML = '';
  renderNav();
  const vis = pagesForRole();
  const okPage = vis.some((p) => p.k === S.page) || vis.some((p) => (p.children || []).some((c) => c.k === S.page));
  if (!okPage) S.page = 'home';
  const p = S.page;
  if (p === 'home') renderHome();
  else if (p === 'todo') renderTodo();
  else if (p === 'all') renderAll();
  else if (p === 'cashier') renderCashier();
  else if (p === 'report') renderReport();
  else if (p === 'flow') renderFlow();
  else if (p === 'notice') renderNotice();
  else if (p === 'purchase') renderForm('purchase');
  else if (p === 'expense') renderForm('expense');
  renderOverlay();
}

render();
</script>
</body>
</html>
