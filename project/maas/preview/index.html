<html lang="zh-CN">
<head>

  <title>MaaS · 算力智能调度中枢</title>
  <style>
    /* ===== 演示登录门（仅演示站，不进入 v1.1 交付） ===== */
    #login-gate{
      position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      padding:24px;overflow:auto;
      background:radial-gradient(900px 560px at 18% 12%,rgba(124,92,255,.24),transparent 62%),
                 radial-gradient(760px 520px at 84% 82%,rgba(56,189,248,.18),transparent 60%),
                 #0E0B1B;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    #login-gate::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
      background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(700px 500px at 50% 45%,#000,transparent 78%);
      mask-image:radial-gradient(700px 500px at 50% 45%,#000,transparent 78%);
    }
    .lg-card{
      position:relative;width:100%;max-width:404px;padding:34px 34px 28px;
      border-radius:20px;border:1px solid rgba(255,255,255,.13);
      background:linear-gradient(160deg,rgba(38,31,66,.94),rgba(22,18,40,.96));
      box-shadow:0 30px 90px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07) inset;
      color:#F4F1FF;
    }
    .lg-brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
    .lg-mark{
      display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 11px;
      border-radius:11px;font-size:12.5px;font-weight:800;letter-spacing:.4px;color:#fff;
      background:linear-gradient(135deg,#7C5CFF,#B06CFF);box-shadow:0 6px 20px rgba(124,92,255,.38);
    }
    .lg-brand-txt{display:flex;flex-direction:column;gap:2px}
    .lg-brand-txt b{font-size:14.5px;font-weight:700;letter-spacing:.2px}
    .lg-brand-txt small{font-size:10.5px;color:#A79EC8;letter-spacing:.5px}
    .lg-title{font-size:23px;font-weight:700;letter-spacing:-.4px;margin:0 0 7px}
    .lg-sub{font-size:12px;color:#A79EC8;line-height:1.7;margin:0 0 26px}
    .lg-field{margin-bottom:16px}
    .lg-field label{display:block;font-size:11.5px;font-weight:600;color:#CFC7E8;margin-bottom:8px;letter-spacing:.3px}
    .lg-input{
      width:100%;box-sizing:border-box;height:44px;padding:0 14px;border-radius:10px;

      color:#F4F1FF;font-size:13.5px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
      font-family:inherit;
    }
    .lg-input::placeholder{color:#7C739B}
    .lg-input:focus{border-color:#9A7BFF;background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
    .lg-btn{
      width:100%;height:45px;margin-top:8px;border:0;border-radius:10px;cursor:pointer;
      font-family:inherit;font-size:13.5px;font-weight:700;color:#fff;letter-spacing:.5px;
      background:linear-gradient(115deg,#7C5CFF,#A855F7);
      box-shadow:0 10px 26px rgba(124,92,255,.34);transition:transform .15s,filter .15s;
    }
    .lg-btn:hover{filter:brightness(1.09);transform:translateY(-1px)}
    .lg-btn:active{transform:translateY(0)}
    .lg-err{
      display:none;margin-top:13px;padding:9px 12px;border-radius:8px;font-size:11.5px;
      color:#FFB4B4;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.28);
    }
    .lg-err.on{display:block}
    .lg-hint{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.09);
      font-size:11px;color:#8F86B0;

<body class="maas-locked">
  <div id="app"></div>

  <div id="login-gate" role="dialog" aria-label="演示登录">
    <div class="lg-card">
      <div class="lg-brand">
        <span class="lg-mark">MaaS</span>
        <span class="lg-brand-txt"><b>算力智能调度中枢</b><small>Model as a Service · 统一调度平台</small></span>
      </div>
      <h1 class="lg-title">欢迎登录</h1>
      <p class="lg-sub">一个入口，统一调度所有模型。查看余额、用量与渠道状态。</p>

      <div class="lg-field">
        <label for="lg-user">用户名</label>
        <input id="lg-user" class="lg-input" type="text" autocomplete="username" placeholder="请输入用户名" />
      </div>
      <div class="lg-field">
        <label for="lg-pass">密码</label>
        <input id="lg-pass" class="lg-input" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button id="lg-submit" class="lg-btn" type="button">登录控制台</button>
      <div id="lg-err" class="lg-err" role="alert">账号或密码不正确，请重试</div>

      <div class="lg-hint">
        <span>演示账号 <code>demo</code> ／ 密码 <code>12345</code></span>
        <span id="lg-fill" class="lg-fill">一键填入</span>
      </div>
      <div class="lg-foot">MaaS · 算力智能调度中枢 · 演示环境</div>
    </div>
  </div>

  <script>
  /* 演示登录门：纯前端校验，仅用于意向客户演示，不涉及任何真实鉴权。 */
  (function () {
    var KEY = 'maas_demo_auth';
    var gate = document.getElementById('login-gate');
    var user = document.getElementById('lg-user');
    var pass = document.getElementById('lg-pass');
    var err = document.getElementById('lg-err');
    var memory = false;

    function authed() {
      try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return memory; }
    }
    function setAuth(v) {
      memory = !!v;
      try { sessionStorage.setItem(KEY, v ? '1' : '0'); } catch (e) { /* file:// 降级为内存态 */ }
    }
    function showGate(show) {
      gate.style.display = show ? 'flex' : 'none';
      document.body.classList.toggle('maas-locked', show);
      document.body.classList.toggle('maas-authed', !show);
      if (show) { err.classList.remove('on'); pass.value = ''; setTimeout(function () { user.focus(); }, 30); }
    }
    function submit() {
      if (user.value.trim() === 'demo' && pass.value === '12345') {
        setAuth(true);
        showGate(false);
      } else {
        err.classList.add('on');
        pass.value = '';
        pass.focus();
      }
    }
    document.getElementById('lg-submit').addEventListener('click', submit);
    document.getElementById('lg-fill').addEventListener('click', function () {
      user.value = 'demo'; pass.value = '12345'; err.classList.remove('on'); pass.focus();
    });
    [user, pass].forEach(function (el) {
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      el.addEventListener('input', function () { err.classList.remove('on'); });
    });
    window.__maasLogout = function () { setAuth(false); showGate(true); };
    showGate(!authed());
  })();
  </script>
